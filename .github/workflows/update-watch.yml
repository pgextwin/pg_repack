name: Upstream update watch

on:
  schedule:
    # GitHub Actions cron uses UTC; schedules are staggered across the initial repositories.
    - cron: "19 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Detect and summarize without changing Issues
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  watch:
    permissions:
      contents: read
      issues: write
    uses: pgextwin/build/.github/workflows/check-extension-updates.yml@09c0f7f51b4a8db53af203b37aebc2030e9eaebe
    with:
      extension_config_path: config/extension.json
      update_watch_path: config/update-watch.json
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
