name: Issue 311 R06 fleet local PREPARE verifier (NONPUBLISHING)

# One new protected local request file; no schedule, dispatch or privileged writer.
on:
  push:
    branches: [main]
    paths:
      - ".github/execution-requests/r-*-r06local*.json"
  pull_request:
    paths:
      - ".github/workflows/issue311-fleet-local-prepare.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: issue311-fleet-local-prepare-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy_test:
    if: github.event_name == 'pull_request'
    name: Prove no schedule, replay or privileged local PREPARE
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: ff551bd2ea20da869e644691090b5ee7c82553ba
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'
      - run: python tests/test-issue311-r06-fleet-local-prepare.py

  local_prepare:
    name: Verify exact original 17 protected mains and immutable PREPARE ZIP
    if: github.repository == 'pgextwin/pg_repack' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'ShutenOishi'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pgextwin/build
          ref: ff551bd2ea20da869e644691090b5ee7c82553ba
          path: .pgextwin-build
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'
      - name: Verify original central source Run/job/ZIP and 17 exact SHA (NEVER WRITE)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .pgextwin-build/scripts/issue311-r06-fleet-local-prepare.py run
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue311-fleet-local-prepare-receipt
          path: issue311-r06-fleet-local-prepare-receipt.json
          if-no-files-found: error
          retention-days: 30
