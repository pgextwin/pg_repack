name: Promote verified upstream candidate to attested Release (manual only)

on:
  workflow_dispatch:
    inputs:
      candidate_pr:
        description: Merged automation-owned immutable manifest-only candidate PR number
        required: true
        type: string
      candidate_run_id:
        description: Successful exact-head Windows candidate dispatch run ID
        required: true
        type: string
      decision_run_id:
        description: Completed upstream watch run holding candidate-decision artifact
        required: true
        type: string
      release_tag:
        description: New and NEVER-used Windows Release tag
        required: true
        type: string
      confirm_release:
        description: Type PUBLISH to explicitly authorize this formal Release
        required: true
        type: string

concurrency:
  group: pg_repack-human-release-promotion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Invoke centrally shared unchanged legacy manual Promotion
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: pgextwin/build/.github/workflows/promote-legacy-verified-release.yml@8cdf68c82d1aae202a706d2bd15db29be10c9e2b
    with:
      candidate_pr: ${{ inputs.candidate_pr }}
      candidate_run_id: ${{ inputs.candidate_run_id }}
      decision_run_id: ${{ inputs.decision_run_id }}
      release_tag: ${{ inputs.release_tag }}
      confirm_release: ${{ inputs.confirm_release }}
